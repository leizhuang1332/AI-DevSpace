zone:
  # ─── 身份(必填 · 5 字段) ───
  id: analyzing
  name: ANALYZING
  display_name: 分析
  icon: 🧠
  route_segment: analyzing

  # ─── 环境(必填 · 5 字段) ───
  has_resource_tree: false
  has_inline_rail: false
  # issue 08 · ADR-0021 决策 45-50:不再有 Admission / Tech Brief / Aggregate Module
  # 页面布局;Analysis Skill 单选器 + Analysis Run 历史抽屉 + Analysis Issue +
  # Issue Response + Analysis Run Log 是唯一 UI 形态。
  main_layout: analysis-skill-runs
  status_color: blue
  status_pulse: true                     # 保持(蓝脉动)

  # ─── 装备(必填 · 1 字段 · ADR-0013 工位注册表 default_arming) ───
  # issue 08 · ADR-0021 决策 50:Analysis Skill 由用户为每次 Run 显式单选,
  # ANALYZING 工位不再预装入 built-in Skill,也不再有 admission-check /
  # tech-brief-scaffold / requirement-brainstorm 等旧 Skill。
  default_arming: []

  # ─── 触发器(可选 · 2 字段) ───
  entry_triggers:
    - "DRAFTING 工位 PRD 完成时,弹出建议:进入 ANALYZING 选择 Analysis Skill"
  exit_triggers: []

  # ─── 备注(可选 · 1 字段) ───
  description: |
    由 Analysis Skill 驱动的 Analysis Run:选择 Skill、发起 Run、查看与答复
    Analysis Issue、复用历史 Issue Response 作为下一 Run 的需求上下文。
    不再预分 subproblem / risk / option,不再生成 Technical Brief 或
    Aggregate Module,不再有 Pending Adjudication 或运行中 interject。